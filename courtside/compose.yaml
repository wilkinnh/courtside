services:
  courtside:
    build: .
    restart: unless-stopped
    init: true
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${PORT:-8788}:8788"
    environment:
      COURTSIDE_DATA_DIR: /app/data
      COURTSIDE_API_KEY: ${COURTSIDE_API_KEY:-}
      HOME_ASSISTANT_URL: ${HOME_ASSISTANT_URL:-}
      HOME_ASSISTANT_TOKEN: ${HOME_ASSISTANT_TOKEN:-}
      HOME_ASSISTANT_SCRIPT: ${HOME_ASSISTANT_SCRIPT:-script.courtside_play}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - courtside-data:/app/data
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

volumes:
  courtside-data:
